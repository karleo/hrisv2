# Allow ZKTeco / iClock ADMS on plain HTTP (no 301 to HTTPS).
# Many terminals cannot complete TLS or follow redirects.
#
# Plesk / nginx: Domains → Apache & nginx → Additional nginx directives
# Paste into the HTTP (non-SSL) server block, and ensure SEO HTTPS redirect
# does NOT apply to /iclock/ (disable permanent redirect for this path, or
# place this location before the redirect).
#
# Also set in .env:
#   BIOMETRIC_PUSH_BASE_URL=http://hris-stag.primelogistics.ae
#   BIOMETRIC_PUSH_PREFER_HTTP=true
#
# On the terminal ADMS menu use:
#   http://hris-stag.primelogistics.ae/iclock/cdata
#   (or host + port 80 + HTTPS OFF)

location ^~ /iclock/ {
    # Do not redirect this location to HTTPS.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Plesk + Apache backend (typical):
    proxy_pass http://127.0.0.1:7080;
    proxy_read_timeout 60s;
}
